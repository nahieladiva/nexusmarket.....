spring.application.name=nexusmarket
server.port=${SERVER_PORT:8080}

# =========================================================
# MySQL: users, catalog, stock, carts, orders, invoices, shipments, returns and refunds
# Outside Docker it uses localhost; Docker Compose passes DB_URL.
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =========================================================
# MongoDB: audit log, stock history and issued JWT tokens
# (Spring Boot 4 uses spring.mongodb.*; the old key is kept as well)
# =========================================================
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}

# =========================================================
# JWT: HMAC secret of at least 32 characters. Change it outside development.
# =========================================================
nexusmarket.jwt.secret=${JWT_SECRET:nexusmarket-development-secret-change-it-0123456789}

# =========================================================
# Initial administrator (created at startup if it does not exist)
# =========================================================
nexusmarket.admin.email=${ADMIN_EMAIL:admin@nexusmarket.com}
nexusmarket.admin.password=${ADMIN_PASSWORD:Admin2026}

# Notifications (log adapter) visible in the console
logging.level.application.adapters.out.system=INFO

# Authentication only uses JWT: without this, Spring creates an in-memory user
# and logs a generated password that nobody uses.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Swagger: UI at /swagger-ui.html and specification at /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
