spring.application.name=nexusmarket
server.port=${SERVER_PORT:8080}

# =========================================================
# MySQL — usuarios, productos, bodegas, inventario, pedidos, promociones
# Fuera de Docker usa localhost; dentro de Docker Compose se pasa DB_URL.
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =========================================================
# MongoDB — bitácora de auditoría, historial de stock y base de tokens JWT
# (Spring Boot 4 usa spring.mongodb.*; se deja también la clave antigua)
# =========================================================
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}

# =========================================================
# JWT — clave HMAC de al menos 32 caracteres. Cámbiela fuera de desarrollo.
# =========================================================
nexusmarket.jwt.secret=${JWT_SECRET:nexusmarket-clave-de-desarrollo-cambiar-0123456789}

# =========================================================
# Administrador inicial (se crea al arrancar si no existe)
# =========================================================
nexusmarket.admin.email=${ADMIN_EMAIL:admin@nexusmarket.com}
nexusmarket.admin.password=${ADMIN_PASSWORD:Admin2026}

# Notificaciones (adaptador de log) visibles en consola
logging.level.application.adapters.out.system=INFO
