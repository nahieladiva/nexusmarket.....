# NexusMarket: MySQL + MongoDB + API Spring Boot
# Uso:  docker compose up -d --build      (la API queda en http://localhost:8080)
services:
  mysql:
    image: mysql:8.0
    container_name: nexusmarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexusmarket
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - nexus_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:7.0
    container_name: nexusmarket-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - nexus_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./nexusm
    container_name: nexusmarket-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MONGODB_URI: mongodb://mongo:27017/nexusmarket
      JWT_SECRET: ${JWT_SECRET:-nexusmarket-clave-de-desarrollo-cambiar-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexusmarket.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2026}
      TZ: America/Bogota
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  nexus_mysql:
  nexus_mongo:
