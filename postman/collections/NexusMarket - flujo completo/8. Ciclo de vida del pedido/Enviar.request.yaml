$kind: http-request
url: "{{base}}/api/orders/{{orderId}}/ship"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("SHIPPED", () => pm.expect(pm.response.json().status).to.eql("SHIPPED"));
    language: text/javascript
order: 4000
