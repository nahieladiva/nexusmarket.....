$kind: http-request
url: "{{base}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "TEC-{{run}}",
      "name": "Copia",
      "description": "x",
      "price": {
        "amount": "1000",
        "currency": "COP"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409 - SKU único", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
