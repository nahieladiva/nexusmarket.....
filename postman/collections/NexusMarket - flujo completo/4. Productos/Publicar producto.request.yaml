$kind: http-request
url: "{{base}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "TEC-{{run}}",
      "name": "Audífonos {{run}}",
      "description": "Bluetooth",
      "price": {
        "amount": "150000",
        "currency": "COP"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test("Precio 150000 COP", () => pm.expect(j.priceAmount).to.eql("150000.00"));
      pm.collectionVariables.set("productId", j.id);
    language: text/javascript
order: 1000
