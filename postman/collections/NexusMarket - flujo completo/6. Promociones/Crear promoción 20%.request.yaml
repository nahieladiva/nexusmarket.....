$kind: http-request
url: "{{base}}/api/promotions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "discountPercent": 20,
      "startDate": "{{hoy}}",
      "endDate": "{{fin}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("promotionId", pm.response.json().id);
    language: text/javascript
order: 1000
