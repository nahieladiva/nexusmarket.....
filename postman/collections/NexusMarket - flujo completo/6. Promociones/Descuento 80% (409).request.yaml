$kind: http-request
url: "{{base}}/api/promotions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "discountPercent": 80,
      "startDate": "{{hoy}}",
      "endDate": "{{fin}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409 - máximo 70%", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
