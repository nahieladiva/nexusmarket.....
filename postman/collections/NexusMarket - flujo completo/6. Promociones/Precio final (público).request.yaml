$kind: http-request
url: "{{base}}/api/promotions/price/{{productId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("150000 - 20% = 120000", () => pm.expect(pm.response.json().finalPrice).to.eql("120000.00"));
    language: text/javascript
order: 4000
