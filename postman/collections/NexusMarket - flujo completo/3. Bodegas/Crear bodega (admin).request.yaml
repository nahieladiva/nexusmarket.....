$kind: http-request
url: "{{base}}/api/warehouses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Bodega Norte {{run}}",
      "address": {
        "street": "Calle 50 # 40-20",
        "city": "Medellín",
        "state": "Antioquia",
        "zipCode": "050001",
        "country": "Colombia"
      },
      "location": {
        "aisle": "A",
        "shelf": "1",
        "bin": "1"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test("Activa", () => pm.expect(j.active).to.eql(true));
      pm.collectionVariables.set("warehouseId", j.id);
    language: text/javascript
order: 1000
