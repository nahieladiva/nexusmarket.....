$kind: http-request
url: "{{base}}/api/warehouses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "X{{run}}",
      "address": {
        "street": "Calle 50 # 40-20",
        "city": "Medellín",
        "state": "Antioquia",
        "zipCode": "050001",
        "country": "Colombia"
      },
      "location": {
        "aisle": "A",
        "shelf": "1",
        "bin": "1"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403 - solo ADMIN", () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
