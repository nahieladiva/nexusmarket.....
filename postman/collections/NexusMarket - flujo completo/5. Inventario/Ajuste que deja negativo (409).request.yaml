$kind: http-request
url: "{{base}}/api/inventory/adjust"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "warehouseId": "{{warehouseId}}",
      "delta": -50,
      "reason": "Conteo físico"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409 - stock nunca negativo", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
