$kind: http-request
url: "{{base}}/api/inventory"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "warehouseId": "{{warehouseId}}",
      "onHand": 20,
      "reorderThreshold": 5,
      "location": {
        "aisle": "B",
        "shelf": "2",
        "bin": "3"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("onHand 20", () => pm.expect(pm.response.json().onHand).to.eql(20));
    language: text/javascript
order: 1000
