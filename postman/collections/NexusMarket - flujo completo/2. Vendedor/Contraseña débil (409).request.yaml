$kind: http-request
url: "{{base}}/api/auth/register/seller"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Otro",
      "email": "debil{{run}}@nexus.com",
      "phone": "+573001112233",
      "password": "solotexto",
      "businessName": "Otra"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409 - política de contraseñas", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
