$kind: http-request
url: "{{base}}/api/auth/register/seller"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Vendedor {{run}}",
      "email": "vendedor{{run}}@nexus.com",
      "phone": "+5730011{{run}}",
      "password": "Tienda2026",
      "businessName": "Tienda {{run}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test("Rol SELLER", () => pm.expect(j.role).to.eql("SELLER"));
      pm.collectionVariables.set("sellerId", j.id);
    language: text/javascript
order: 1000
