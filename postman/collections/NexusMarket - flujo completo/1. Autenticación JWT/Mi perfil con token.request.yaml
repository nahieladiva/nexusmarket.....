$kind: http-request
url: "{{base}}/api/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Es el admin", () => pm.expect(pm.response.json().role).to.eql("ADMIN"));
    language: text/javascript
order: 2000
