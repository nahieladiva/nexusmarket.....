$kind: http-request
url: "{{base}}/api/inventory/movements?productId={{productId}}&warehouseId={{warehouseId}}"
method: GET
queryParams:
  productId: "{{productId}}"
  warehouseId: "{{warehouseId}}"
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const tipos = pm.response.json().map(m => m.type);
      pm.test("5 movimientos: " + tipos.join(", "), () => pm.expect(tipos.length).to.eql(5));
    language: text/javascript
order: 1000
