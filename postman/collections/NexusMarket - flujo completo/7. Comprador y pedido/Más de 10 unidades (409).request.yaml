$kind: http-request
url: "{{base}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 11
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409 - máximo 10 por producto", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
