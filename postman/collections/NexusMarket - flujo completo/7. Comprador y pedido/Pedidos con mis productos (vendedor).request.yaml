$kind: http-request
url: "{{base}}/api/orders/seller"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Incluye el pedido", () => pm.expect(pm.response.json().map(o => o.id)).to.include(pm.collectionVariables.get("orderId")));
    language: text/javascript
order: 8000
