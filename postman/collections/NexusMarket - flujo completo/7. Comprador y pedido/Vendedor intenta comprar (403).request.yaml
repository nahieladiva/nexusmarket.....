$kind: http-request
url: "{{base}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403 - solo BUYER", () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
